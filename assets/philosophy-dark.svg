    <path d="M 712 30 Q 713.5 38.5 722 40 Q 713.5 41.5 712 50 Q 710.5 41.5 702 40 Q 710.5 38.5 712 30 Z" fill="#fff"/>
    <text class="mono" x="860" y="34" font-size="11" font-weight="600" fill="#8B949E" text-anchor="end" letter-spacing="1">04</text>
