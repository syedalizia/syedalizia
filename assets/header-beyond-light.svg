<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 92" width="880" height="92" role="img" aria-label="Beyond the Code">
  <title>Beyond the Code</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fade-up { opacity: 0; animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade-in { opacity: 0; animation: fadeIn .8s ease-out forwards; }
    .slide { opacity: 0; animation: slide .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(1040px); } }
    
    
  </style>

  <g class="slide">
    <text class="mono" x="2" y="26" font-size="13" font-weight="600" fill="url(#accent)" letter-spacing="2">08 /</text>
    <text x="2" y="58" font-size="28" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Beyond the Code</text>
  </g>
  <text class="fade-in" style="animation-delay:0.35s" x="878" y="58" font-size="14" fill="#57606A" text-anchor="end">What keeps me sharp</text>
  <line x1="2" y1="78" x2="878" y2="78" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
  <line x1="2" y1="78" x2="878" y2="78" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="880" stroke-dashoffset="880" style="animation: draw 1.4s .2s cubic-bezier(.6,0,.2,1) forwards"/>
  <rect y="76" width="120" height="4" fill="url(#shine)" style="animation: sweep 3.2s 1.6s ease-in-out infinite"/>
  <circle cx="874" cy="78" r="4" fill="#7C3AED" class="pulse"/>
</svg>