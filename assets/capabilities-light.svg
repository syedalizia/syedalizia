<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-label="Core capabilities">
  <title>Core capabilities</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fade-up { opacity: 0; animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade-in { opacity: 0; animation: fadeIn .8s ease-out forwards; }
    .slide { opacity: 0; animation: slide .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(1040px); } }
    
    
  </style>

  <g class="fade-up" style="animation-delay:0.00s">
    <rect x="0.5" y="0.5" width="281.6666666666667" height="167" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <clipPath id="clip8"><rect x="0.5" y="0.5" width="281.6666666666667" height="167" rx="14"/></clipPath>
    <g clip-path="url(#clip8)"><g transform="translate(-223 0.5) skewX(-24)">
      <rect width="110" height="167" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;648.6666666666667 0;648.6666666666667 0" keyTimes="0;0.28;1" dur="7s" begin="1.40s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <rect x="24" y="24" width="34" height="34" rx="9" fill="url(#accent)"/>
    <text class="mono" x="41" y="46" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">01</text>
    <text x="72" y="47" font-size="16.5" font-weight="700" fill="#0F172A">Applied AI &amp; ML</text>
    <circle cx="260.6666666666667" cy="146" r="3.5" fill="#7C3AED" class="pulse" style="animation-delay:0.0s"/>
    <text x="24" y="92" font-size="13.5" fill="#57606A">LLM integrations, RAG pipelines,</text>
    <text x="24" y="112" font-size="13.5" fill="#57606A">AI agents, and production-ready</text>
    <text x="24" y="132" font-size="13.5" fill="#57606A">machine learning features.</text>
  </g>
  <g class="fade-up" style="animation-delay:0.12s">
    <rect x="299.1666666666667" y="0.5" width="281.6666666666667" height="167" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <clipPath id="clip9"><rect x="299.1666666666667" y="0.5" width="281.6666666666667" height="167" rx="14"/></clipPath>
    <g clip-path="url(#clip9)"><g transform="translate(75.66666666666669 0.5) skewX(-24)">
      <rect width="110" height="167" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;648.6666666666667 0;648.6666666666667 0" keyTimes="0;0.28;1" dur="7s" begin="1.70s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <rect x="322.6666666666667" y="24" width="34" height="34" rx="9" fill="url(#accent)"/>
    <text class="mono" x="339.6666666666667" y="46" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">02</text>
    <text x="370.6666666666667" y="47" font-size="16.5" font-weight="700" fill="#0F172A">Solution Architecture</text>
    <circle cx="559.3333333333334" cy="146" r="3.5" fill="#7C3AED" class="pulse" style="animation-delay:0.4s"/>
    <text x="322.6666666666667" y="92" font-size="13.5" fill="#57606A">Scalable distributed systems,</text>
    <text x="322.6666666666667" y="112" font-size="13.5" fill="#57606A">API design, microservices, and</text>
    <text x="322.6666666666667" y="132" font-size="13.5" fill="#57606A">cloud-native platforms.</text>
  </g>
  <g class="fade-up" style="animation-delay:0.24s">
    <rect x="597.8333333333334" y="0.5" width="281.6666666666667" height="167" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <clipPath id="clip10"><rect x="597.8333333333334" y="0.5" width="281.6666666666667" height="167" rx="14"/></clipPath>
    <g clip-path="url(#clip10)"><g transform="translate(374.33333333333337 0.5) skewX(-24)">
      <rect width="110" height="167" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;648.6666666666667 0;648.6666666666667 0" keyTimes="0;0.28;1" dur="7s" begin="2.00s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <rect x="621.3333333333334" y="24" width="34" height="34" rx="9" fill="url(#accent)"/>
    <text class="mono" x="638.3333333333334" y="46" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">03</text>
    <text x="669.3333333333334" y="47" font-size="16.5" font-weight="700" fill="#0F172A">Full-Stack Engineering</text>
    <circle cx="858" cy="146" r="3.5" fill="#7C3AED" class="pulse" style="animation-delay:0.8s"/>
    <text x="621.3333333333334" y="92" font-size="13.5" fill="#57606A">Refined, responsive interfaces</text>
    <text x="621.3333333333334" y="112" font-size="13.5" fill="#57606A">backed by secure,</text>
    <text x="621.3333333333334" y="132" font-size="13.5" fill="#57606A">high-performance services.</text>
  </g>
  <g class="fade-up" style="animation-delay:0.36s">
    <rect x="0.5" y="184.5" width="281.6666666666667" height="167" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <clipPath id="clip11"><rect x="0.5" y="184.5" width="281.6666666666667" height="167" rx="14"/></clipPath>
    <g clip-path="url(#clip11)"><g transform="translate(-223 184.5) skewX(-24)">
      <rect width="110" height="167" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;648.6666666666667 0;648.6666666666667 0" keyTimes="0;0.28;1" dur="7s" begin="2.30s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <rect x="24" y="208" width="34" height="34" rx="9" fill="url(#accent)"/>
    <text class="mono" x="41" y="230" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">04</text>
    <text x="72" y="231" font-size="16.5" font-weight="700" fill="#0F172A">Workflow Automation</text>
    <circle cx="260.6666666666667" cy="330" r="3.5" fill="#7C3AED" class="pulse" style="animation-delay:1.2s"/>
    <text x="24" y="276" font-size="13.5" fill="#57606A">n8n and AI-driven automations</text>
    <text x="24" y="296" font-size="13.5" fill="#57606A">that remove manual effort from</text>
    <text x="24" y="316" font-size="13.5" fill="#57606A">operations.</text>
  </g>
  <g class="fade-up" style="animation-delay:0.48s">
    <rect x="299.1666666666667" y="184.5" width="281.6666666666667" height="167" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <clipPath id="clip12"><rect x="299.1666666666667" y="184.5" width="281.6666666666667" height="167" rx="14"/></clipPath>
    <g clip-path="url(#clip12)"><g transform="translate(75.66666666666669 184.5) skewX(-24)">
      <rect width="110" height="167" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;648.6666666666667 0;648.6666666666667 0" keyTimes="0;0.28;1" dur="7s" begin="2.60s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <rect x="322.6666666666667" y="208" width="34" height="34" rx="9" fill="url(#accent)"/>
    <text class="mono" x="339.6666666666667" y="230" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">05</text>
    <text x="370.6666666666667" y="231" font-size="16.5" font-weight="700" fill="#0F172A">Cloud &amp; DevOps</text>
    <circle cx="559.3333333333334" cy="330" r="3.5" fill="#7C3AED" class="pulse" style="animation-delay:1.6s"/>
    <text x="322.6666666666667" y="276" font-size="13.5" fill="#57606A">Containerization, CI/CD</text>
    <text x="322.6666666666667" y="296" font-size="13.5" fill="#57606A">pipelines, observability, and</text>
    <text x="322.6666666666667" y="316" font-size="13.5" fill="#57606A">repeatable deployments.</text>
  </g>
  <g class="fade-up" style="animation-delay:0.60s">
    <rect x="597.8333333333334" y="184.5" width="281.6666666666667" height="167" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <clipPath id="clip13"><rect x="597.8333333333334" y="184.5" width="281.6666666666667" height="167" rx="14"/></clipPath>
    <g clip-path="url(#clip13)"><g transform="translate(374.33333333333337 184.5) skewX(-24)">
      <rect width="110" height="167" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;648.6666666666667 0;648.6666666666667 0" keyTimes="0;0.28;1" dur="7s" begin="2.90s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <rect x="621.3333333333334" y="208" width="34" height="34" rx="9" fill="url(#accent)"/>
    <text class="mono" x="638.3333333333334" y="230" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">06</text>
    <text x="669.3333333333334" y="231" font-size="16.5" font-weight="700" fill="#0F172A">Technical Leadership</text>
    <circle cx="858" cy="330" r="3.5" fill="#7C3AED" class="pulse" style="animation-delay:2.0s"/>
    <text x="621.3333333333334" y="276" font-size="13.5" fill="#57606A">Architecture governance, code</text>
    <text x="621.3333333333334" y="296" font-size="13.5" fill="#57606A">quality, team mentorship, and</text>
    <text x="621.3333333333334" y="316" font-size="13.5" fill="#57606A">delivery strategy.</text>
  </g>
</svg>