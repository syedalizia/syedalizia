<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 150" width="432" height="150" role="img" aria-label="Google Project Management — Specialization · Google · Apr 2024">
  <title>Google Project Management — Specialization · Google · Apr 2024</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fade-up { opacity: 0; animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade-in { opacity: 0; animation: fadeIn .8s ease-out forwards; }
    .slide { opacity: 0; animation: slide .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(1040px); } }
    
    
  </style>

  <g class="fade-up" style="animation-delay:0.18s">
    <rect x="0.5" y="0.5" width="431" height="149" rx="14" fill="#161B22" stroke="#30363D"/>
    <clipPath id="clip23"><rect x="0.5" y="0.5" width="431" height="149" rx="14"/></clipPath>
    <g clip-path="url(#clip23)"><g transform="translate(-214 0.5) skewX(-24)">
      <rect width="110" height="149" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;780 0;780 0" keyTimes="0;0.28;1" dur="7s" begin="2.00s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <circle cx="54" cy="62" r="34" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 54 62" to="360 54 62" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="62" r="26" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M 42 62 l 8 8 l 15 -16" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="40" stroke-dashoffset="40" style="animation: draw .7s 0.78s ease-out forwards"/>
    <text x="96" y="48" font-size="17" font-weight="700" fill="#F0F6FC">Google Project Management</text>
    <text class="mono" x="96" y="70" font-size="12" font-weight="600" fill="url(#accent)" letter-spacing="1">SPECIALIZATION · GOOGLE · APR 2024</text>
    <text x="96" y="98" font-size="13.5" fill="#8B949E">Credential ID PC8DRZYVPVVW · Agile Project</text>
    <text x="96" y="118" font-size="13.5" fill="#8B949E">Management.</text>
    <text class="mono fade-in" style="animation-delay:1.00s" x="414" y="134" font-size="11" font-weight="600" fill="url(#accent)" letter-spacing="1" text-anchor="end">VERIFY CREDENTIAL ↗</text>
  </g>
</svg>