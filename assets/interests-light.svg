      <text x="217" y="37" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Algorithms</text>
    </g>
  </g>
  <g class="fade-up" style="animation-delay:0.20s">
    <g class="float" style="animation-delay:1.0s">
      <rect x="297.8333333333333" y="10" width="135.66666666666666" height="44" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="365.66666666666663" y="37" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Problem-Solving</text>
    </g>
  </g>
  <g class="fade-up" style="animation-delay:0.30s">
    <g class="float" style="animation-delay:1.5s">
      <rect x="446.5" y="10" width="135.66666666666666" height="44" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="514.3333333333334" y="37" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Hiking</text>
    </g>
  </g>
  <g class="fade-up" style="animation-delay:0.40s">
    <g class="float" style="animation-delay:2.0s">
      <rect x="595.1666666666666" y="10" width="135.66666666666666" height="44" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="663" y="37" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Cycling</text>
    </g>
