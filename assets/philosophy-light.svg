<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="880" height="120" role="img" aria-label="Thoughtful UX + Solid Engineering + Scalable Architecture + Practical AI = Products That Last">
  <title>Thoughtful UX + Solid Engineering + Scalable Architecture + Practical AI = Products That Last</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fade-up { opacity: 0; animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade-in { opacity: 0; animation: fadeIn .8s ease-out forwards; }
    .slide { opacity: 0; animation: slide .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(1040px); } }
    .glow { animation: glow 2.6s 1.8s ease-in-out infinite; opacity: 0; } @keyframes glow { 0%,100% { opacity: 0; } 50% { opacity: .9; } }
    
  </style>

  <g class="fade-up" style="animation-delay:0.00s">
    <rect x="26" y="22" width="119" height="44" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="85.5" y="49" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Thoughtful UX</text>
  </g><text class="fade-in" style="animation-delay:0.15s" x="158.5" y="51" font-size="20" font-weight="700" fill="#57606A" text-anchor="middle">+</text>
  <g class="fade-up" style="animation-delay:0.25s">
    <rect x="172" y="22" width="146" height="44" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="245" y="49" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Solid Engineering</text>
  </g><text class="fade-in" style="animation-delay:0.40s" x="331.5" y="51" font-size="20" font-weight="700" fill="#57606A" text-anchor="middle">+</text>
  <g class="fade-up" style="animation-delay:0.50s">
    <rect x="345" y="22" width="174" height="44" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="432" y="49" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Scalable Architecture</text>
  </g><text class="fade-in" style="animation-delay:0.65s" x="532.5" y="51" font-size="20" font-weight="700" fill="#57606A" text-anchor="middle">+</text>
  <g class="fade-up" style="animation-delay:0.75s">
    <rect x="546" y="22" width="112" height="44" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="602" y="49" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Practical AI</text>
  </g><text class="fade-in" style="animation-delay:0.90s" x="671.5" y="51" font-size="20" font-weight="700" fill="#57606A" text-anchor="middle">=</text>
  <g class="fade-up" style="animation-delay:1.15s">
    <rect x="681.5" y="19" width="176" height="50" rx="25" fill="none" stroke="#6366F1" stroke-width="2" class="glow"/>
    <rect x="684.5" y="22" width="170" height="44" rx="22" fill="url(#accent)"/>
    <text x="769.5" y="49" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Products That Last</text>
  </g>
  <text class="fade-in" style="animation-delay:1.50s" x="440" y="108" font-size="13.5" fill="#57606A" text-anchor="middle">Simple where possible, designed for change, and measured by the business value it creates.</text>
</svg>