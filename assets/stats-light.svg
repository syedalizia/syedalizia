<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 132" width="880" height="132" role="img" aria-label="13+ years of experience, $100K+ earned on Upwork, 100% Job Success Score, Top Rated Plus">
  <title>13+ years of experience, $100K+ earned on Upwork, 100% Job Success Score, Top Rated Plus</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fade-up { opacity: 0; animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade-in { opacity: 0; animation: fadeIn .8s ease-out forwards; }
    .slide { opacity: 0; animation: slide .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(1040px); } }
    @keyframes grow { to { transform: scaleX(1); } }
    
  </style>

  <g class="fade-up" style="animation-delay:0.00s">
    <rect x="0.5" y="0.5" width="207" height="131" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <clipPath id="clip0"><rect x="0.5" y="0.5" width="207" height="131" rx="14"/></clipPath>
    <g clip-path="url(#clip0)"><g transform="translate(-205 0.5) skewX(-24)">
      <rect width="110" height="131" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;538 0;538 0" keyTimes="0;0.28;1" dur="7s" begin="1.60s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <text x="104" y="60" font-size="32" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">13+</text>
    <text x="104" y="88" font-size="13" fill="#57606A" text-anchor="middle">Years of experience</text>
    <rect x="28" y="108" width="152" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="28" y="108" width="152" height="4" rx="2" fill="url(#accent)"
          style="transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s 0.40s cubic-bezier(.6,0,.2,1) forwards"/>
  </g>
  <g class="fade-up" style="animation-delay:0.15s">
    <rect x="224.5" y="0.5" width="207" height="131" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <clipPath id="clip1"><rect x="224.5" y="0.5" width="207" height="131" rx="14"/></clipPath>
    <g clip-path="url(#clip1)"><g transform="translate(19 0.5) skewX(-24)">
      <rect width="110" height="131" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;538 0;538 0" keyTimes="0;0.28;1" dur="7s" begin="1.95s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <text x="328" y="60" font-size="32" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">$100K+</text>
    <text x="328" y="88" font-size="13" fill="#57606A" text-anchor="middle">Earned on Upwork</text>
    <rect x="252" y="108" width="152" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="252" y="108" width="152" height="4" rx="2" fill="url(#accent)"
          style="transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s 0.55s cubic-bezier(.6,0,.2,1) forwards"/>
  </g>
  <g class="fade-up" style="animation-delay:0.30s">
    <rect x="448.5" y="0.5" width="207" height="131" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <clipPath id="clip2"><rect x="448.5" y="0.5" width="207" height="131" rx="14"/></clipPath>
    <g clip-path="url(#clip2)"><g transform="translate(243 0.5) skewX(-24)">
      <rect width="110" height="131" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;538 0;538 0" keyTimes="0;0.28;1" dur="7s" begin="2.30s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <text x="552" y="60" font-size="32" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">100%</text>
    <text x="552" y="88" font-size="13" fill="#57606A" text-anchor="middle">Job Success Score</text>
    <rect x="476" y="108" width="152" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="476" y="108" width="152" height="4" rx="2" fill="url(#accent)"
          style="transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s 0.70s cubic-bezier(.6,0,.2,1) forwards"/>
  </g>
  <g class="fade-up" style="animation-delay:0.45s">
    <rect x="672.5" y="0.5" width="207" height="131" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <clipPath id="clip3"><rect x="672.5" y="0.5" width="207" height="131" rx="14"/></clipPath>
    <g clip-path="url(#clip3)"><g transform="translate(467 0.5) skewX(-24)">
      <rect width="110" height="131" fill="url(#sheenGrad)">
        <animateTransform attributeName="transform" type="translate" values="0 0;538 0;538 0" keyTimes="0;0.28;1" dur="7s" begin="2.65s" repeatCount="indefinite"/>
      </rect>
    </g></g>
    <text x="776" y="60" font-size="32" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">Top Rated+</text>
    <text x="776" y="88" font-size="13" fill="#57606A" text-anchor="middle">Upwork talent tier</text>
    <rect x="700" y="108" width="152" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="700" y="108" width="152" height="4" rx="2" fill="url(#accent)"
          style="transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s 0.85s cubic-bezier(.6,0,.2,1) forwards"/>
  </g>
</svg>