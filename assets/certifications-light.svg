<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150" role="img" aria-label="Certified Scrum Master; Google Project Management Professional Certificate">
  <title>Certified Scrum Master; Google Project Management Professional Certificate</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fade-up { opacity: 0; animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade-in { opacity: 0; animation: fadeIn .8s ease-out forwards; }
    .slide { opacity: 0; animation: slide .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(1040px); } }
    
    
  </style>

  <g class="fade-up" style="animation-delay:0.00s">
    <rect x="0.5" y="0.5" width="431" height="149" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="54" cy="62" r="26" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M 42 62 l 8 8 l 15 -16" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="40" stroke-dashoffset="40" style="animation: draw .7s 0.60s ease-out forwards"/>
    <text x="96" y="48" font-size="17" font-weight="700" fill="#0F172A">Certified Scrum Master</text>
    <text class="mono" x="96" y="70" font-size="12" font-weight="600" fill="url(#accent)" letter-spacing="1">AGILE LEADERSHIP</text>
    <text x="96" y="98" font-size="13.5" fill="#57606A">Team facilitation, iterative delivery, and</text>
    <text x="96" y="118" font-size="13.5" fill="#57606A">continuous improvement.</text>
  </g>
  <g class="fade-up" style="animation-delay:0.18s">
    <rect x="448.5" y="0.5" width="431" height="149" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="502" cy="62" r="26" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M 490 62 l 8 8 l 15 -16" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="40" stroke-dashoffset="40" style="animation: draw .7s 0.78s ease-out forwards"/>
    <text x="544" y="48" font-size="17" font-weight="700" fill="#0F172A">Google Project Management</text>
    <text class="mono" x="544" y="70" font-size="12" font-weight="600" fill="url(#accent)" letter-spacing="1">PROFESSIONAL CERTIFICATE</text>
    <text x="544" y="98" font-size="13.5" fill="#57606A">Planning, stakeholder and risk management, and</text>
    <text x="544" y="118" font-size="13.5" fill="#57606A">delivery governance.</text>
  </g>
</svg>